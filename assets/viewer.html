<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gloom</title><style>
:root{color-scheme:dark;--bg:#11131a;--panel:#191c26;--text:#e7e9f2;--muted:#949aae;--accent:#8b7cf6;--cycle:#ef6f91}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
#bar{position:fixed;z-index:2;display:flex;gap:10px;align-items:center;top:16px;left:16px;right:16px;pointer-events:none}.box{pointer-events:auto;background:#191c26ed;border:1px solid #303545;border-radius:10px;padding:10px;box-shadow:0 8px 24px #0007}
#search{width:260px;background:#10121a;color:var(--text);border:1px solid #3c4256;border-radius:6px;padding:7px 9px}button{background:#303548;color:var(--text);border:0;border-radius:6px;padding:8px 10px;cursor:pointer}button:hover{background:#414861}#stats{color:var(--muted)}
#detail{position:fixed;z-index:2;right:16px;top:72px;width:280px;max-height:calc(100vh - 88px);overflow:auto;display:none}#detail h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}#detail ul{padding-left:20px;color:var(--muted)}#detail li{margin:5px 0;cursor:pointer}.tag{display:inline-block;padding:2px 6px;border-radius:10px;background:#31374a;color:#bdc3d8;font-size:11px;margin-right:5px}
canvas{display:block;width:100vw;height:100vh}.hint{position:fixed;left:18px;bottom:14px;color:#72798e;font-size:12px;pointer-events:none}
</style></head><body><div id="bar"><div class="box"><input id="search" placeholder="Search functions…"><button id="reset">Reset view</button></div><div id="stats" class="box"></div></div><aside id="detail" class="box"></aside><canvas id="graph"></canvas><div class="hint">Scroll to zoom · drag background to pan · drag nodes to pin · click a node to inspect</div>
<script>
const VIEW=__GRAPH_DATA__,DATA=VIEW.document,canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),detail=document.querySelector('#detail');
let W,H,dpr,scale=1,pan={x:0,y:0},drag=null,hover=null,selected=null,query='',frame;
const nodes=DATA.nodes.map((n,i)=>({...n,x:Math.cos(i*2.4)*Math.sqrt(i+1)*34,y:Math.sin(i*2.4)*Math.sqrt(i+1)*34,vx:0,vy:0})),byId=new Map(nodes.map(n=>[n.id,n]));
const edges=DATA.edges.map(e=>({...e,a:byId.get(e.source),b:byId.get(e.target)})).filter(e=>e.a&&e.b),cycles=new Set((DATA.analysis?.cycles||[]).flat());
const namedCalls=VIEW.named_calls||[];
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;draw()}
function screen(n){return{x:W/2+pan.x+n.x*scale,y:H/2+pan.y+n.y*scale}}function visible(n){return !query||n.label.toLowerCase().includes(query)}
function simulate(){for(let k=0;k<90;k++){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.1,f=650/d2;a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f}for(const e of edges){let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1,f=(d-105)*.002;e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f}for(const n of nodes){if(n.pin)continue;n.vx=(n.vx-n.x*.0003)*.82;n.vy=(n.vy-n.y*.0003)*.82;n.x+=n.vx;n.y+=n.vy}}draw()}
function draw(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);for(const e of edges){if(!visible(e.a)||!visible(e.b))continue;let a=screen(e.a),b=screen(e.b);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=selected&&(e.a===selected||e.b===selected)?'#a99ffc':'#353b4c';ctx.lineWidth=selected&&(e.a===selected||e.b===selected)?1.8:1;ctx.stroke()}for(const n of nodes){if(!visible(n))continue;let p=screen(n),r=(n===selected?8:5.5)*Math.max(.75,Math.min(scale,1.4));ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=cycles.has(n.id)?'#ef6f91':n.defined?'#8b7cf6':'#657086';ctx.fill();if(n===hover||n===selected||scale>1.35){ctx.font='12px system-ui';ctx.fillStyle='#e7e9f2';ctx.fillText(n.label,p.x+r+4,p.y+4)}}})}
function hit(x,y){let best=null,dist=14;for(const n of nodes){if(!visible(n))continue;let p=screen(n),d=Math.hypot(p.x-x,p.y-y);if(d<dist){best=n;dist=d}}return best}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function links(xs){return '<ul>'+xs.map(x=>`<li data-id="${escapeHtml(x.id)}">${escapeHtml(x.label)}</li>`).join('')+'</ul>'}
function explanationRows(n){let calls=namedCalls.filter(call=>call.legacy_caller_id===n.id);if(!calls.length)return '';return `<b>Evidence-backed calls (${calls.length})</b><ul>${calls.map(call=>`<li><details><summary>${escapeHtml(call.relationship.callee_name)} · ${escapeHtml(call.relationship.explanation_handle)}</summary><p>${escapeHtml(call.explanation.derivation)}</p><pre>${escapeHtml(JSON.stringify({evidence:call.explanation.evidence,observation_context:call.explanation.observation_context},null,2))}</pre></details></li>`).join('')}</ul>`}
function select(n){selected=n;if(!n){detail.style.display='none';draw();return}let outgoing=edges.filter(e=>e.a===n).map(e=>e.b),incoming=edges.filter(e=>e.b===n).map(e=>e.a);detail.style.display='block';detail.innerHTML=`<h2>${escapeHtml(n.label)}</h2><p><span class="tag">${n.defined?'defined':'external'}</span>${cycles.has(n.id)?'<span class="tag">cycle</span>':''}</p><p>${escapeHtml(n.source||'No source metadata')}</p>${explanationRows(n)}<b>Legacy projection calls (${outgoing.length})</b>${links(outgoing)}<b>Called by (${incoming.length})</b>${links(incoming)}`;detail.querySelectorAll('li[data-id]').forEach(li=>li.onclick=()=>select(byId.get(li.dataset.id)));draw()}
canvas.onmousedown=e=>{let n=hit(e.clientX,e.clientY);drag=n?{node:n}:{x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};if(n)n.pin=true};canvas.onmousemove=e=>{hover=hit(e.clientX,e.clientY);canvas.style.cursor=hover?'pointer':drag?'grabbing':'grab';if(!drag)return;if(drag.node){drag.node.x=(e.clientX-W/2-pan.x)/scale;drag.node.y=(e.clientY-H/2-pan.y)/scale}else{pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y}draw()};canvas.onmouseup=e=>{if(drag?.node)select(drag.node);drag=null};canvas.onmouseleave=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();scale=Math.max(.15,Math.min(4,scale*Math.exp(-e.deltaY*.001)));draw()};
document.querySelector('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();draw()};document.querySelector('#reset').onclick=()=>{scale=1;pan={x:0,y:0};select(null)};document.querySelector('#stats').textContent=`${nodes.length} nodes · ${edges.length} edges · ${cycles.size} functions in cycles`;addEventListener('resize',resize);resize();simulate();
</script></body></html>
