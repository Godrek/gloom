<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gloom evidence-backed calls</title><style>
:root{color-scheme:dark;--bg:#11131a;--panel:#191c26;--text:#e7e9f2;--muted:#949aae;--accent:#8b7cf6;--line:#303545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{width:min(920px,calc(100% - 32px));margin:32px auto}h1{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 24px}.relationship{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;box-shadow:0 8px 24px #0005}.summary{display:flex;align-items:center;gap:12px;width:100%;min-width:0;padding:16px;border:0;border-radius:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}.summary:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.callable{font:600 15px ui-monospace,monospace;overflow-wrap:anywhere}.arrow{color:var(--accent);font-size:18px}.tag{margin-left:auto;border-radius:999px;background:#31374a;color:#bdc3d8;padding:4px 8px;font-size:11px}.explanation{display:none;border-top:1px solid var(--line);padding:16px;color:var(--muted)}.relationship.open .explanation{display:block}.explanation strong{color:var(--text)}dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0}dt{color:#767e94}dd{margin:0;overflow-wrap:anywhere}code{font:12px ui-monospace,monospace;color:#c8c2ff}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style></head><body><main><h1>Evidence-backed direct calls</h1><p class="subtitle" id="snapshot"></p><section id="relationships"></section></main>
<script>
const DATA=__SNAPSHOT_DATA__,root=document.querySelector('#relationships');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
document.querySelector('#snapshot').textContent=`Published snapshot ${DATA.program_snapshot.id} · ${DATA.relationships.length} direct call relationship${DATA.relationships.length===1?'':'s'}`;
if(!DATA.relationships.length)root.innerHTML='<div class="empty">No direct-call target claims were projected.</div>';
for(const item of DATA.relationships){const relationship=item.relationship,explanation=item.explanation,record=explanation.evidence_records[0],card=document.createElement('article');card.className='relationship';card.innerHTML=`<button type="button" class="summary" aria-expanded="false"><span class="callable">${escapeHtml(relationship.caller_display_name)}</span><span class="arrow">→</span><span class="callable">${escapeHtml(relationship.callee_display_name)}</span><span class="tag">${escapeHtml(relationship.resolution)}</span></button><div class="explanation"><dl><dt>Explanation</dt><dd><code>${escapeHtml(relationship.explanation_handle)}</code></dd><dt>Call site</dt><dd><code>${escapeHtml(relationship.call_site_id)}</code></dd><dt>Evidence</dt><dd><strong>${escapeHtml(record.evidence_type)}</strong><br><code>${escapeHtml(record.id)}</code><br>${escapeHtml(record.description)}</dd><dt>Location</dt><dd>${escapeHtml(record.source_location.artifact)}:${record.source_location.line}</dd><dt>Derivation</dt><dd><code>${escapeHtml(explanation.derivation.rule)}</code></dd><dt>Context</dt><dd><code>${escapeHtml(relationship.observation_context_id)}</code></dd></dl></div>`;const toggle=card.querySelector('.summary');toggle.onclick=()=>{const open=card.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open))};root.appendChild(card)}
</script></body></html>
