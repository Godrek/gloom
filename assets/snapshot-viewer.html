<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gloom evidence-backed calls</title><style>
:root{color-scheme:dark;--bg:#11131a;--panel:#191c26;--text:#e7e9f2;--muted:#949aae;--accent:#8b7cf6;--line:#303545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{width:min(920px,calc(100% - 32px));margin:32px auto}h1{font-size:24px;margin:0 0 6px}.subtitle{color:var(--muted);margin:0 0 24px}.relationship{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;box-shadow:0 8px 24px #0005}.relationship.unresolved{border-color:#8b6f38}.summary{display:flex;align-items:center;gap:12px;width:100%;min-width:0;padding:16px;border:0;border-radius:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}.summary:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.callable{font:600 15px ui-monospace,monospace;overflow-wrap:anywhere}.origin{color:var(--muted);font:12px ui-monospace,monospace;overflow-wrap:anywhere}.arrow{color:var(--accent);font-size:18px}.unresolved-label{color:#e9bd68}.tag{margin-left:auto;border-radius:999px;background:#31374a;color:#bdc3d8;padding:4px 8px;font-size:11px}.explanation{display:none;border-top:1px solid var(--line);padding:16px;color:var(--muted)}.relationship.open .explanation{display:block}.explanation strong{color:var(--text)}dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0}dt{color:#767e94}dd{margin:0;overflow-wrap:anywhere}code{font:12px ui-monospace,monospace;color:#c8c2ff}.empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
</style></head><body><main><h1>Evidence-backed call sites</h1><p class="subtitle" id="snapshot"></p><section id="relationships"></section></main>
<script>
const DATA=__SNAPSHOT_DATA__,root=document.querySelector('#relationships');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const evidenceById=new Map(DATA.evidence_records.map(record=>[record.id,record]));
const targetClaimsBySite=new Map,correspondenceByManifestation=new Map,derivationsByClaim=new Map;
function append(index,key,value){if(!index.has(key))index.set(key,[]);index.get(key).push(value)}
for(const claim of DATA.target_claims)append(targetClaimsBySite,claim.call_site_id,claim);
for(const claim of DATA.correspondence_claims)for(const id of claim.manifestation_ids)append(correspondenceByManifestation,id,claim);
for(const derivation of DATA.derivations)append(derivationsByClaim,derivation.output_claim_id,derivation);
function explain(item){
  const target_claims=targetClaimsBySite.get(item.call_site.call_site_id)||[];
  const correspondence_claims=[...new Set(target_claims.flatMap(claim=>correspondenceByManifestation.get(claim.target_manifestation_id)||[]))];
  const evidenceIds=new Set([...item.call_site_resolution.evidence_ids,...target_claims.flatMap(claim=>claim.evidence_ids),...correspondence_claims.flatMap(claim=>claim.evidence_ids)]);
  return {target_claims,correspondence_claims,evidence_records:[...evidenceIds].map(id=>evidenceById.get(id)),derivations:target_claims.flatMap(claim=>derivationsByClaim.get(claim.id)||[])};
}
function renderExplanation(item){
  const site=item.call_site,explanation=explain(item),targetless=site.targets.length===0,record={source_location:item.source_location},targetContexts=targetless?'None':site.targets.map(target=>`<code>${escapeHtml(target.callee_display_name)}</code> — <code>${escapeHtml(target.target_observation_context_id)}</code>`).join('<br>'),evidence=explanation.evidence_records.map(record=>`<strong>${escapeHtml(record.evidence_type)}</strong><br><code>${escapeHtml(record.id)}</code><br>${escapeHtml(record.description)}<br>Provenance: <code>${escapeHtml(record.source_location.artifact)}:${record.source_location.line}</code> from acquired input <code>${escapeHtml(record.acquired_input_id)}</code>`).join('<br><br>'),derivations=explanation.derivations.length?explanation.derivations.map(item=>`<code>${escapeHtml(item.rule)}</code>`).join('<br>'):'None',correspondence=explanation.correspondence_claims.length?explanation.correspondence_claims.map(item=>`<code>${escapeHtml(item.contributor_callable_identity.id)}</code> (${escapeHtml(item.contributor_callable_identity.scope)}) — <code>${escapeHtml(item.id)}</code><br>Rule: <code>${escapeHtml(item.rule)}</code><br>${item.manifestation_ids.map(id=>`<code>${escapeHtml(id)}</code>`).join(' ↔ ')}`).join('<br><br>'):'None';
  return `<dl><dt>Explanation</dt><dd><code>${escapeHtml(site.explanation_handle)}</code></dd><dt>Caller</dt><dd><code>${escapeHtml(site.caller_entity_id)}</code></dd><dt>Call site</dt><dd><code>${escapeHtml(site.call_site_id)}</code></dd><dt>Evidence</dt><dd>${evidence}</dd><dt>Call-site location</dt><dd><code>${escapeHtml(record.source_location.artifact)}:${record.source_location.line}</code></dd><dt>Derivations</dt><dd>${derivations}</dd><dt>Target contexts</dt><dd>${targetContexts}</dd><dt>Target correspondence</dt><dd>${correspondence}</dd><dt>Resolution context</dt><dd><code>${escapeHtml(site.resolution_observation_context_id)}</code></dd></dl>`;
}
document.querySelector('#snapshot').textContent=`Published snapshot ${DATA.program_snapshot.id} · ${DATA.call_sites.length} call site${DATA.call_sites.length===1?'':'s'}`;
if(!DATA.call_sites.length)root.innerHTML='<div class="empty">No call sites were projected.</div>';
for(const item of DATA.call_sites){
  const site=item.call_site,incomplete=item.target_set_incomplete,targetNames=site.targets.map(target=>target.callee_display_name).join(', '),targetLabel=site.targets.length===0?'Unresolved call site':incomplete?`Possible targets: ${targetNames}`:targetNames;
  const card=document.createElement('article');
  card.className=`relationship${incomplete?' unresolved':''}`;
  card.innerHTML=`<button type="button" class="summary" aria-expanded="false"><span class="callable">${escapeHtml(site.caller_display_name)}</span><span class="origin">${escapeHtml(item.source_location.artifact)}</span><span class="arrow">→</span><span class="callable${incomplete?' unresolved-label':''}">${escapeHtml(targetLabel)}</span><span class="tag">${escapeHtml(site.resolution)}</span></button><div class="explanation"></div>`;
  const toggle=card.querySelector('.summary'),panel=card.querySelector('.explanation');
  toggle.onclick=()=>{const open=card.classList.toggle('open');if(open&&!panel.hasChildNodes())panel.innerHTML=renderExplanation(item);toggle.setAttribute('aria-expanded',String(open))};
  root.appendChild(card);
}
</script></body></html>
