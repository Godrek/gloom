[package]
name = "gloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LLVM-oriented program graph extraction, analysis, and visualization"
license = "MIT"
repository = "https://github.com/Godrek/gloom"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
